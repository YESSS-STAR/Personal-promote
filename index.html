<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airheads Pre-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF9FB;
    --surface:#FFFFFF;
    --text:#1C1420;
    --muted:#8A7C87;
    --border:#F1DDE5;
    --primary:#FF4F81;
    --primary-dark:#E23E6C;
    --accent:#8E5CD9;
    --success:#2FAE66;
    --danger:#E14A4A;
    --shadow: 0 2px 10px rgba(28,20,32,0.06);
    --radius:16px;
  }
  html[data-theme="dark"]{
    --bg:#17111A;
    --surface:#221A26;
    --text:#F5EEF2;
    --muted:#B39EAC;
    --border:#33262E;
    --primary:#FF6B93;
    --primary-dark:#FF4F81;
    --accent:#B085F5;
    --shadow: 0 2px 14px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; padding:0;}
  body,button,input{font-family:'Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  body{
    background:var(--bg);
    color:var(--text);
    transition:background .25s ease, color .25s ease;
    min-height:100vh;
    padding-bottom:100px;
  }
  a{color:inherit;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    flex-shrink:0;
  }
  .brand-text h1{font-size:17px; margin:0; letter-spacing:.2px;}
  .brand-text span{font-size:11px; color:var(--muted); font-weight:500;}

  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--text);
    transition:transform .15s ease, background .2s ease;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn svg{width:18px;height:18px;}

  .header-actions{display:flex; gap:8px; align-items:center;}

  main{max-width:560px; margin:0 auto; padding:20px 16px 0;}

  .hero{margin-bottom:18px;}
  .hero h2{font-size:22px; margin:0 0 4px; font-weight:700;}
  .hero p{margin:0; color:var(--muted); font-size:13.5px;}

  .flavor-grid{display:flex; flex-direction:column; gap:12px;}

  .flavor-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .flavor-card::before, .flavor-card::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:14px; height:26px;
    background:var(--bg);
    border:1px solid var(--border);
  }
  .flavor-card::before{ left:-8px; border-radius:50%; }
  .flavor-card::after{ right:-8px; border-radius:50%; }

  .flavor-dot{
    width:44px; height:44px; border-radius:50%;
    flex-shrink:0;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.12);
  }
  .flavor-info{flex:1; min-width:0;}
  .flavor-info h3{margin:0 0 2px; font-size:15.5px; font-weight:700;}
  .flavor-meta{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .price{font-weight:700; color:var(--text); font-size:14px;}
  .stock-tag{
    font-size:11px; font-weight:600; padding:2px 7px; border-radius:20px;
  }
  .stock-ok{background:rgba(47,174,102,0.12); color:var(--success);}
  .stock-low{background:rgba(255,159,28,0.15); color:#C97C0A;}
  html[data-theme="dark"] .stock-low{color:#FFB55C;}
  .stock-out{background:rgba(225,74,74,0.12); color:var(--danger);}

  .qty-controls{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .qty-btn{
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .qty-btn:disabled{opacity:.35; cursor:not-allowed;}
  .qty-val{min-width:18px; text-align:center; font-weight:700; font-size:14px;}

  .add-btn{
    border:none; background:var(--primary); color:#fff;
    font-weight:700; font-size:13px;
    padding:9px 14px; border-radius:20px; cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .add-btn:active{transform:scale(0.95);}
  .add-btn:disabled{background:var(--border); color:var(--muted); cursor:not-allowed;}

  /* Cart bar */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    max-width:560px; margin:0 auto;
    padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .cart-inner{
    background:var(--primary);
    color:#fff;
    border-radius:18px;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(255,79,129,0.35);
    cursor:pointer;
    transform:translateY(120%);
    transition:transform .3s ease;
  }
  .cart-inner.show{transform:translateY(0);}
  .cart-inner .cnt{font-size:13px; opacity:.9;}
  .cart-inner .amt{font-weight:700; font-size:16px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,10,16,0.5);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%; max-width:560px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
    max-height:88vh; overflow-y:auto;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-head h3{margin:0; font-size:18px;}
  .close-x{cursor:pointer; color:var(--muted); font-size:20px; line-height:1; background:none; border:none;}

  .cart-line{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .cart-line:last-of-type{border-bottom:none;}
  .cart-line .lname{font-weight:600;}
  .cart-line .lsub{color:var(--muted); font-size:12px;}
  .remove-line{background:none;border:none;color:var(--danger); font-size:12px; cursor:pointer; font-weight:600;}

  .cart-total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0 6px; font-weight:700; font-size:15px;
  }

  label{font-size:12.5px; font-weight:600; color:var(--muted); display:block; margin:14px 0 6px;}
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    font-size:14.5px;
  }
  input[type=text]:focus{outline:2px solid var(--primary); outline-offset:1px;}

  .primary-btn{
    width:100%; margin-top:18px; padding:14px; border:none; border-radius:14px;
    background:var(--primary); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .primary-btn:disabled{background:var(--border); color:var(--muted);}
  .ghost-note{font-size:12px; color:var(--muted); margin-top:10px; text-align:center;}

  .empty-cart{text-align:center; color:var(--muted); padding:30px 0; font-size:14px;}

  /* Confirmation */
  .confirm-icon{
    width:60px;height:60px;border-radius:50%;
    background:rgba(47,174,102,0.12); color:var(--success);
    display:flex; align-items:center; justify-content:center;
    margin:6px auto 14px; font-size:28px;
  }
  .confirm-title{text-align:center; font-size:19px; font-weight:700; margin:0 0 4px;}
  .confirm-sub{text-align:center; color:var(--muted); font-size:13.5px; margin:0 0 18px;}
  .wa-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; border-radius:14px; border:none;
    background:#25D366; color:#fff; font-weight:700; font-size:15px; cursor:pointer;
    text-decoration:none;
  }
  .secondary-btn{
    width:100%; margin-top:10px; padding:13px; border-radius:14px;
    background:none; border:1px solid var(--border); color:var(--text);
    font-weight:600; font-size:14px; cursor:pointer;
  }

  .footer-link{
    text-align:center; margin:34px 0 10px; font-size:12px; color:var(--muted);
  }
  .footer-link a{color:var(--muted); text-decoration:underline;}

  .toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-10px);
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:60; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .skeleton{
    height:78px; border-radius:var(--radius); background:linear-gradient(90deg,var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size:200% 100%; animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <h1>Airheads</h1>
      <span>School Candy Pre-Order</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </div>
</div>

<main>
  <div class="hero">
    <h2>Pick your flavors</h2>
    <p>Stock updates live. Order now, pay &amp; collect in class.</p>
  </div>

  <div class="flavor-grid" id="flavorGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="footer-link"><a href="/admin">Staff login</a></div>
</main>

<div class="cart-bar">
  <div class="cart-inner" id="cartBar">
    <span class="cnt" id="cartCount">0 items</span>
    <span class="amt" id="cartAmt">$0.00</span>
  </div>
</div>

<!-- Cart Sheet -->
<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Your order</h3>
      <button class="close-x" id="closeCart">&times;</button>
    </div>
    <div id="cartLines"></div>
    <div class="cart-total-row">
      <span>Total</span>
      <span id="sheetTotal">$0.00</span>
    </div>
    <label for="buyerName">Your name</label>
    <input type="text" id="buyerName" placeholder="e.g. Aisyah Rahman" maxlength="60">
    <label for="buyerClass">Class</label>
    <input type="text" id="buyerClass" placeholder="e.g. Sec 2 Amanah" maxlength="30">
    <button class="primary-btn" id="placeOrderBtn">Place pre-order</button>
    <div class="ghost-note">You'll confirm payment with us on WhatsApp after ordering.</div>
  </div>
</div>

<!-- Confirmation Sheet -->
<div class="overlay" id="confirmOverlay">
  <div class="sheet">
    <div class="confirm-icon">&#10003;</div>
    <p class="confirm-title">Order placed!</p>
    <p class="confirm-sub" id="confirmSub">We've saved your pre-order.</p>
    <a class="wa-btn" id="waLink" href="#" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A8.86 8.86 0 0 0 12.04 3.7c-4.9 0-8.9 3.99-8.9 8.9 0 1.57.41 3.1 1.19 4.44L3 21.3l4.4-1.26a8.9 8.9 0 0 0 4.63 1.28h.01c4.9 0 8.9-3.99 8.9-8.9 0-2.38-.93-4.62-2.34-6.1zM12.04 19.9h-.01a7.35 7.35 0 0 1-3.75-1.03l-.27-.16-2.79.8.75-2.72-.18-.28a7.36 7.36 0 0 1-1.13-3.91c0-4.07 3.31-7.38 7.4-7.38a7.34 7.34 0 0 1 7.38 7.4c0 4.07-3.32 7.38-7.4 7.38zm4.05-5.53c-.22-.11-1.3-.64-1.5-.72-.2-.07-.35-.11-.5.11-.15.22-.57.72-.7.87-.13.15-.26.16-.48.05a6.05 6.05 0 0 1-1.78-1.1 6.66 6.66 0 0 1-1.23-1.53c-.13-.22-.01-.34.1-.45.1-.1.22-.26.33-.39.11-.13.15-.22.22-.37.07-.15.04-.28-.02-.39-.06-.11-.5-1.2-.68-1.65-.18-.43-.36-.37-.5-.38h-.43c-.15 0-.39.06-.6.28-.2.22-.79.77-.79 1.87 0 1.1.81 2.17.92 2.32.11.15 1.6 2.44 3.87 3.42.54.23.96.37 1.29.48.54.17 1.03.15 1.42.09.43-.06 1.3-.53 1.49-1.04.18-.51.18-.95.13-1.04-.05-.09-.2-.15-.42-.26z"/></svg>
      Message us on WhatsApp
    </a>
    <button class="secondary-btn" id="doneBtn">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  let db;
  let firebaseReady = false;
  let maintenanceMode = false;

  // Check if Firebase loaded
  if (typeof firebase === 'undefined') {
    console.error('❌ Firebase SDK failed to load. Check your network connection.');
    document.getElementById('flavorGrid').innerHTML = '<div class="empty-cart" style="padding:40px 20px;text-align:center;"><strong>⚠️ Connection error</strong><p style="margin-top:8px;font-size:13px;color:var(--muted);">Unable to load from database. Please refresh the page.</p></div>';
  } else {
    try {
      const firebaseConfig = {
        databaseURL: "https://airheader-6ec67-default-rtdb.asia-southeast1.firebasedatabase.app/"
      };
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      firebaseReady = true;
      console.log('✓ Firebase initialized');

      // Check maintenance status
      db.ref('settings/maintenance').on('value', snap => {
        maintenanceMode = snap.val() === true;
        if(maintenanceMode){
          document.body.innerHTML = `
            <div style="height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;text-align:center;padding:20px;">
              <div style="font-size:48px;margin-bottom:16px;">🔧</div>
              <h1 style="margin:0 0 8px;font-size:22px;font-family:'Poppins',sans-serif;">Under Maintenance</h1>
              <p style="margin:0;color:var(--muted);font-size:14px;max-width:300px;">We're updating Airheads right now. Check back in a few minutes!</p>
            </div>
          `;
        }
      });
    } catch (err) {
      console.error('❌ Firebase init error:', err);
      document.getElementById('flavorGrid').innerHTML = '<div class="empty-cart" style="padding:40px 20px;text-align:center;"><strong>⚠️ Setup error</strong><p style="margin-top:8px;font-size:13px;color:var(--muted);">Firebase configuration issue. Contact support.</p></div>';
    }
  }


  const WHATSAPP_NUMBER = "6588351447"; // +65 88351447

  const FLAVOR_COLORS = {
    "Orange": "#FF8A3D",
    "Blue Raspberry": "#3D8CFF",
    "Grape": "#8E5CD9",
    "Watermelon": "#FF5C7A",
    "Cherry": "#E0203C",
    "White Mystery": "#E8E2ED"
  };
  const FLAVOR_ORDER = ["Orange","Blue Raspberry","Grape","Watermelon","Cherry","White Mystery"];

  let inventory = {};
  let cart = {}; // flavor -> qty
  let lastOrderSummary = "";

  // ---------- Theme ----------
  const sunPath = `<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>`;
  const moonPath = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
  const themeIcon = document.getElementById('themeIcon');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeIcon.innerHTML = t === 'dark' ? sunPath : moonPath;
    localStorage.setItem('airheads-theme', t);
  }
  const savedTheme = localStorage.getItem('airheads-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);
  document.getElementById('themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // ---------- Render Inventory ----------
  const grid = document.getElementById('flavorGrid');
  if (firebaseReady) {
    db.ref('inventory').on('value', snap => {
      inventory = snap.val() || {};
      renderGrid();
    }, err => {
      console.error('❌ Inventory load error:', err);
      grid.innerHTML = '<div class="empty-cart" style="padding:40px 20px;text-align:center;"><strong>⚠️ Database error</strong><p style="margin-top:8px;font-size:13px;color:var(--muted);">Could not load inventory. Try refreshing.</p></div>';
    });
  }

  function renderGrid(){
    grid.innerHTML = "";
    FLAVOR_ORDER.forEach(flavor => {
      const item = inventory[flavor] || {price:0, stock:0};
      const stock = Number(item.stock) || 0;
      const price = Number(item.price) || 0;
      const qty = cart[flavor] || 0;

      const card = document.createElement('div');
      card.className = 'flavor-card';

      let stockTagHtml = '';
      if(stock <= 0){
        stockTagHtml = `<span class="stock-tag stock-out">Out of stock</span>`;
      } else if(stock <= 5){
        stockTagHtml = `<span class="stock-tag stock-low">${stock} left</span>`;
      } else {
        stockTagHtml = `<span class="stock-tag stock-ok">${stock} in stock</span>`;
      }

      card.innerHTML = `
        <div class="flavor-dot" style="background:${FLAVOR_COLORS[flavor]}"></div>
        <div class="flavor-info">
          <h3>${flavor}</h3>
          <div class="flavor-meta">
            <span class="price">$${price.toFixed(2)}</span>
            ${stockTagHtml}
          </div>
        </div>
        ${qty > 0 ? `
          <div class="qty-controls">
            <button class="qty-btn" data-action="dec" data-flavor="${flavor}">&minus;</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-action="inc" data-flavor="${flavor}" ${qty >= stock ? 'disabled' : ''}>+</button>
          </div>
        ` : `
          <button class="add-btn" data-action="add" data-flavor="${flavor}" ${stock <= 0 ? 'disabled' : ''}>
            ${stock <= 0 ? 'Sold out' : 'Add'}
          </button>
        `}
      `;
      grid.appendChild(card);
    });
    updateCartBar();
  }

  grid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-flavor]');
    if(!btn || btn.disabled) return;
    const flavor = btn.dataset.flavor;
    const action = btn.dataset.action;
    const stock = Number((inventory[flavor]||{}).stock) || 0;
    const cur = cart[flavor] || 0;

    if(action === 'add' || action === 'inc'){
      if(cur < stock){ cart[flavor] = cur + 1; }
    } else if(action === 'dec'){
      cart[flavor] = Math.max(0, cur - 1);
      if(cart[flavor] === 0) delete cart[flavor];
    }
    renderGrid();
  });

  // ---------- Cart bar & sheet ----------
  const cartBar = document.getElementById('cartBar');
  const cartOverlay = document.getElementById('cartOverlay');
  const confirmOverlay = document.getElementById('confirmOverlay');

  function cartTotal(){
    return Object.entries(cart).reduce((sum,[flavor,qty]) => {
      const price = Number((inventory[flavor]||{}).price) || 0;
      return sum + price*qty;
    }, 0);
  }
  function cartCount(){
    return Object.values(cart).reduce((a,b)=>a+b,0);
  }
  function updateCartBar(){
    const count = cartCount();
    document.getElementById('cartCount').textContent = `${count} item${count===1?'':'s'}`;
    document.getElementBy
