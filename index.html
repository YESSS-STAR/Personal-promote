<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airheads Pre-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF9FB;
    --surface:#FFFFFF;
    --text:#1C1420;
    --muted:#8A7C87;
    --border:#F1DDE5;
    --primary:#FF4F81;
    --primary-dark:#E23E6C;
    --accent:#8E5CD9;
    --success:#2FAE66;
    --danger:#E14A4A;
    --warning:#C97C0A;
    --shadow: 0 2px 10px rgba(28,20,32,0.06);
    --radius:16px;
  }
  html[data-theme="dark"]{
    --bg:#17111A;
    --surface:#221A26;
    --text:#F5EEF2;
    --muted:#B39EAC;
    --border:#33262E;
    --primary:#FF6B93;
    --primary-dark:#FF4F81;
    --accent:#B085F5;
    --warning:#FFB55C;
    --shadow: 0 2px 14px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; padding:0;}
  body,button,input{font-family:'Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  body{
    background:var(--bg);
    color:var(--text);
    transition:background .25s ease, color .25s ease;
    min-height:100vh;
    padding-bottom:100px;
  }
  a{color:inherit;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    flex-shrink:0;
  }
  .brand-text h1{font-size:17px; margin:0; letter-spacing:.2px;}
  .brand-text span{font-size:11px; color:var(--muted); font-weight:500;}

  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--text);
    transition:transform .15s ease, background .2s ease;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn svg{width:18px;height:18px;}

  .header-actions{display:flex; gap:8px; align-items:center;}

  main{max-width:560px; margin:0 auto; padding:20px 16px 0;}

  .hero{margin-bottom:18px;}
  .hero h2{font-size:22px; margin:0 0 4px; font-weight:700;}
  .hero p{margin:0; color:var(--muted); font-size:13.5px;}

  .flavor-grid{display:flex; flex-direction:column; gap:12px;}

  .flavor-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .flavor-card::before, .flavor-card::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:14px; height:26px;
    background:var(--bg);
    border:1px solid var(--border);
  }
  .flavor-card::before{ left:-8px; border-radius:50%; }
  .flavor-card::after{ right:-8px; border-radius:50%; }

  .flavor-dot{
    width:44px; height:44px; border-radius:50%;
    flex-shrink:0;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.12);
  }
  .flavor-info{flex:1; min-width:0;}
  .flavor-info h3{margin:0 0 2px; font-size:15.5px; font-weight:700;}
  .flavor-meta{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .price{font-weight:700; color:var(--text); font-size:14px;}
  .stock-tag{
    font-size:11px; font-weight:600; padding:2px 7px; border-radius:20px;
  }
  .stock-ok{background:rgba(47,174,102,0.12); color:var(--success);}
  .stock-low{background:rgba(255,159,28,0.15); color:var(--warning);}
  html[data-theme="dark"] .stock-low{color:var(--warning);}
  .stock-out{background:rgba(225,74,74,0.12); color:var(--danger);}

  .qty-controls{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .qty-btn{
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .qty-btn:disabled{opacity:.35; cursor:not-allowed;}
  .qty-val{min-width:18px; text-align:center; font-weight:700; font-size:14px;}

  .add-btn{
    border:none; background:var(--primary); color:#fff;
    font-weight:700; font-size:13px;
    padding:9px 14px; border-radius:20px; cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .add-btn:active{transform:scale(0.95);}
  .add-btn:disabled{background:var(--border); color:var(--muted); cursor:not-allowed;}

  /* Cart bar */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    max-width:560px; margin:0 auto;
    padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .cart-inner{
    background:var(--primary);
    color:#fff;
    border-radius:18px;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(255,79,129,0.35);
    cursor:pointer;
    transform:translateY(120%);
    transition:transform .3s ease;
  }
  .cart-inner.show{transform:translateY(0);}
  .cart-inner .cnt{font-size:13px; opacity:.9;}
  .cart-inner .amt{font-weight:700; font-size:16px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,10,16,0.5);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%; max-width:560px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
    max-height:88vh; overflow-y:auto;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-head h3{margin:0; font-size:18px;}
  .close-x{cursor:pointer; color:var(--muted); font-size:20px; line-height:1; background:none; border:none;}

  .cart-line{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .cart-line:last-of-type{border-bottom:none;}
  .cart-line .lname{font-weight:600;}
  .cart-line .lsub{color:var(--muted); font-size:12px;}
  .remove-line{background:none;border:none;color:var(--danger); font-size:12px; cursor:pointer; font-weight:600;}

  .cart-total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0 6px; font-weight:700; font-size:15px;
  }
  .cart-discount{color:var(--success); font-size:13px;}
  .cart-discount del{color:var(--muted); opacity:.7;}

  label{font-size:12.5px; font-weight:600; color:var(--muted); display:block; margin:14px 0 6px;}
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    font-size:14.5px;
  }
  input[type=text]:focus{outline:2px solid var(--primary); outline-offset:1px;}

  .coupon-input-group{display:flex; gap:8px; margin-bottom:14px;}
  .coupon-input-group input{flex:1;}
  .apply-coupon-btn{
    padding:12px 16px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-weight:600; font-size:13px; cursor:pointer;
  }
  .coupon-status{font-size:12px; margin-top:8px; padding:8px; border-radius:8px;}
  .coupon-valid{background:rgba(47,174,102,0.15); color:var(--success);}
  .coupon-invalid{background:rgba(225,74,74,0.12); color:var(--danger);}

  .upsell-card{
    background:linear-gradient(135deg, rgba(255,79,129,.08), rgba(142,92,217,.08));
    border:2px solid var(--primary);
    border-radius:12px;
    padding:14px;
    margin:14px 0;
    display:flex; gap:12px; align-items:center;
  }
  .upsell-icon{
    font-size:24px; flex-shrink:0;
  }
  .upsell-info{flex:1;}
  .upsell-info h4{margin:0 0 4px; font-size:13px; font-weight:700;}
  .upsell-info p{margin:0; font-size:12px; color:var(--muted);}
  .upsell-btn{
    padding:8px 12px; background:var(--primary); color:#fff; border:none;
    border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0;
  }

  .primary-btn{
    width:100%; margin-top:18px; padding:14px; border:none; border-radius:14px;
    background:var(--primary); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .primary-btn:disabled{background:var(--border); color:var(--muted);}
  .ghost-note{font-size:12px; color:var(--muted); margin-top:10px; text-align:center;}

  .empty-cart{text-align:center; color:var(--muted); padding:30px 0; font-size:14px;}

  /* Confirmation */
  .confirm-icon{
    width:60px;height:60px;border-radius:50%;
    background:rgba(47,174,102,0.15); color:var(--success);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; margin:0 auto 12px;
  }
  .confirm-text{text-align:center;}
  .confirm-text h3{font-size:18px; margin:0 0 6px; font-weight:700;}
  .confirm-text p{margin:0; font-size:13px; color:var(--muted);}
  .confirm-sub{font-weight:700; color:var(--text); margin-top:8px;}
  
  .wa-btn, .done-btn{
    width:100%; padding:14px; margin-top:12px; border:none; border-radius:12px;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .wa-btn{background:#25D366; color:#fff;}
  .done-btn{background:var(--primary); color:#fff;}

  /* Toast */
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff; padding:12px 16px; border-radius:20px;
    font-size:13px; z-index:100; opacity:0;
    transition:opacity .25s ease; max-width:90%;
  }
  .toast.show{opacity:1;}

  /* Theme toggle */
  .theme-toggle{
    border:none; background:var(--surface); color:var(--text);
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:16px;
  }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <h1>Airheads</h1>
      <span>Pre-order</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>
</div>

<!-- Main content -->
<main>
  <div class="hero">
    <h2>What flavor do you want?</h2>
    <p>Choose your favorite Airheads and pre-order now</p>
  </div>
  
  <div class="flavor-grid" id="grid"></div>
</main>

<!-- Cart bar (fixed bottom) -->
<div class="cart-bar" id="cartBar">
  <div class="cart-inner">
    <div>
      <div class="cnt" id="cartCount">0 items</div>
      <div class="amt" id="cartAmt">$0.00</div>
    </div>
    <span>→</span>
  </div>
</div>

<!-- Cart overlay/sheet -->
<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Your Cart</h3>
      <button class="close-x" id="closeCart">✕</button>
    </div>
    
    <div id="cartLines"></div>
    
    <!-- Coupon section -->
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
      <label>Coupon Code</label>
      <div class="coupon-input-group">
        <input type="text" id="couponInput" placeholder="Enter code..." maxlength="20">
        <button class="apply-coupon-btn" id="applyCouponBtn">Apply</button>
      </div>
      <div id="couponStatus"></div>
    </div>

    <!-- Upsell section (will be shown conditionally) -->
    <div id="upsellContainer"></div>

    <!-- Totals -->
    <div style="margin-top:16px; padding:14px 0 0; border-top:1px solid var(--border);">
      <div class="cart-total-row">
        <span>Subtotal:</span>
        <span id="sheetSubtotal">$0.00</span>
      </div>
      <div class="cart-total-row" id="discountRow" style="display:none;">
        <span>Discount:</span>
        <span id="discountAmount" class="cart-discount">-$0.00</span>
      </div>
      <div class="cart-total-row" style="font-size:18px; color:var(--primary);">
        <span>Total:</span>
        <span id="sheetTotal">$0.00</span>
      </div>
    </div>

    <!-- Buyer info -->
    <label style="margin-top:18px;">Your Name</label>
    <input type="text" id="buyerName" placeholder="Full name">
    
    <label>Your Class</label>
    <input type="text" id="buyerClass" placeholder="e.g., 10-A">
    
    <button class="primary-btn" id="placeOrderBtn" disabled>Place pre-order</button>
    <p class="ghost-note">WhatsApp confirmation will be sent</p>
  </div>
</div>

<!-- Confirmation overlay -->
<div class="overlay" id="confirmOverlay">
  <div class="sheet">
    <div class="confirm-text">
      <div class="confirm-icon">✓</div>
      <h3>Order Placed!</h3>
      <p>Your pre-order has been submitted</p>
      <div class="confirm-sub" id="confirmSub">Loading...</div>
      <a href="#" id="waLink" class="wa-btn" style="text-decoration:none; display:block;">Send via WhatsApp</a>
      <button class="done-btn" id="doneBtn">Done</button>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-database.js"></script>
<script>
  // ========== CONFIG ==========
  const firebaseConfig = {
    apiKey: "AIzaSyCB8H-6KVdH_Y5JJzpMkW9BrzLrKjH4zxc",
    authDomain: "airheads-preorder.firebaseapp.com",
    databaseURL: "https://airheads-preorder-default-rtdb.asia-southeast1.firebaseio.com",
    projectId: "airheads-preorder",
    storageBucket: "airheads-preorder.appspot.com",
    messagingSenderId: "688779856234",
    appId: "1:688779856234:web:2d4b6c76d3c8e0af1e4531"
  };

  const WHATSAPP_NUMBER = "6581234567";
  const FLAVOR_ORDER = ['Orange', 'Strawberry', 'Watermelon', 'Cherry', 'Grape', 'Lemon'];
  const FLAVOR_COLORS = {
    'Orange': '#FF8C42',
    'Strawberry': '#E91E63',
    'Watermelon': '#FF1744',
    'Cherry': '#D32F2F',
    'Grape': '#7B1FA2',
    'Lemon': '#FDD835'
  };

  // ========== INITIALIZATION ==========
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let firebaseReady = false;
  let inventory = {};
  let cart = {};
  let appliedCoupon = null;
  let lastOrderSummary = '';

  firebase.database().ref().once('value').then(() => {
    firebaseReady = true;
  }).catch(err => {
    console.error('Firebase connection failed:', err);
  });

  // ========== CART PERSISTENCE (LocalStorage) ==========
  const CART_STORAGE_KEY = 'airheads_cart';

  function saveCart() {
    localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
  }

  function loadCart() {
    const saved = localStorage.getItem(CART_STORAGE_KEY);
    if (saved) {
      try {
        cart = JSON.parse(saved);
      } catch (e) {
        cart = {};
      }
    }
  }

  // ========== THEME TOGGLE ==========
  const themeToggle = document.getElementById('themeToggle');
  const htmlEl = document.documentElement;
  
  function initTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) {
      htmlEl.setAttribute('data-theme', saved);
      themeToggle.textContent = saved === 'dark' ? '☀️' : '🌙';
    }
  }
  
  themeToggle.addEventListener('click', () => {
    const current = htmlEl.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    htmlEl.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  // ========== TOAST ==========
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ========== INVENTORY ==========
  const grid = document.getElementById('grid');
  
  loadCart();
  initTheme();

  db.ref('inventory').on('value', snap => {
    inventory = snap.val() || {};
    renderGrid();
  }, err => {
    console.error('❌ Inventory load error:', err);
    grid.innerHTML = '<div class="empty-cart" style="padding:40px 20px;text-align:center;"><strong>⚠️ Database error</strong><p style="margin-top:8px;font-size:13px;color:var(--muted);">Could not load inventory. Try refreshing.</p></div>';
  });

  function renderGrid(){
    grid.innerHTML = "";
    FLAVOR_ORDER.forEach(flavor => {
      const item = inventory[flavor] || {price:0, stock:0};
      const stock = Number(item.stock) || 0;
      const price = Number(item.price) || 0;
      const qty = cart[flavor] || 0;

      const card = document.createElement('div');
      card.className = 'flavor-card';

      let stockTagHtml = '';
      if(stock <= 0){
        stockTagHtml = `<span class="stock-tag stock-out">Out of stock</span>`;
      } else if(stock <= 5){
        stockTagHtml = `<span class="stock-tag stock-low">${stock} left</span>`;
      } else {
        stockTagHtml = `<span class="stock-tag stock-ok">${stock} in stock</span>`;
      }

      card.innerHTML = `
        <div class="flavor-dot" style="background:${FLAVOR_COLORS[flavor]}"></div>
        <div class="flavor-info">
          <h3>${flavor}</h3>
          <div class="flavor-meta">
            <span class="price">$${price.toFixed(2)}</span>
            ${stockTagHtml}
          </div>
        </div>
        ${qty > 0 ? `
          <div class="qty-controls">
            <button class="qty-btn" data-action="dec" data-flavor="${flavor}">&minus;</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-action="inc" data-flavor="${flavor}" ${qty >= stock ? 'disabled' : ''}>+</button>
          </div>
        ` : `
          <button class="add-btn" data-action="add" data-flavor="${flavor}" ${stock <= 0 ? 'disabled' : ''}>
            ${stock <= 0 ? 'Sold out' : 'Add'}
          </button>
        `}
      `;
      grid.appendChild(card);
    });
    updateCartBar();
  }

  grid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-flavor]');
    if(!btn || btn.disabled) return;
    const flavor = btn.dataset.flavor;
    const action = btn.dataset.action;
    const stock = Number((inventory[flavor]||{}).stock) || 0;
    const cur = cart[flavor] || 0;

    if(action === 'add' || action === 'inc'){
      if(cur < stock){ cart[flavor] = cur + 1; }
    } else if(action === 'dec'){
      cart[flavor] = Math.max(0, cur - 1);
      if(cart[flavor] === 0) delete cart[flavor];
    }
    saveCart();
    renderGrid();
  });

  // ========== CART FUNCTIONS ==========
  const cartBar = document.getElementById('cartBar');
  const cartOverlay = document.getElementById('cartOverlay');
  const confirmOverlay = document.getElementById('confirmOverlay');

  function cartTotal(){
    return Object.entries(cart).reduce((sum,[flavor,qty]) => {
      const price = Number((inventory[flavor]||{}).price) || 0;
      return sum + price*qty;
    }, 0);
  }

  function cartCount(){
    return Object.values(cart).reduce((a,b)=>a+b,0);
  }

  function updateCartBar(){
    const count = cartCount();
    document.getElementById('cartCount').textContent = `${count} item${count===1?'':'s'}`;
    document.getElementById('cartAmt').textContent = `$${cartTotal().toFixed(2)}`;
    cartBar.classList.toggle('show', count > 0);
  }

  cartBar.addEventListener('click', openCartSheet);
  document.getElementById('closeCart').addEventListener('click', () => {
    cartOverlay.classList.remove('open');
    appliedCoupon = null;
    document.getElementById('couponInput').value = '';
    document.getElementById('couponStatus').innerHTML = '';
  });
  cart
